# Deploy the static site in web/ to GitHub Pages on every push to main.
# Tests must pass first. The site is plain static files, so moving to another
# host (e.g. Vercel) only means replacing this workflow; nothing in web/ is GitHub-specific.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          pip install -r pipeline/requirements.txt
          pytest -q pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript tests
        working-directory: web
        run: node --test tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (exclude tests and Node config)
        run: |
          mkdir _site
          cp -R web/. _site/
          rm -rf _site/tests _site/package.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
